apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.whatever.verifit"
        minSdkVersion 16
        targetSdkVersion 31
        versionCode 14
        versionName "1.0.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        // Retour Romain 28/09/2026 : "un numero de build [...] pour verifier qu'on
        // parle bien de la meme version" (voir SettingsActivity, preference "version").
        // Horodatage genere automatiquement a CHAQUE build (aucun geste manuel, donc
        // aucun risque d'oubli de mise a jour comme avec versionName ci-dessus) :
        // System.currentTimeMillis() est evalue quand Gradle configure ce module, ce
        // qui arrive a chaque build/rebuild (le script n'est pas mis en cache par
        // defaut dans ce projet). BuildConfig.BUILD_TIMESTAMP est donc l'heure a
        // laquelle CE build a ete produit, pas l'heure d'installation ni l'heure
        // actuelle du telephone.
        buildConfigField "long", "BUILD_TIMESTAMP", "${System.currentTimeMillis()}L"
    }

    // Requis depuis AGP 8.0 (deja recommande en 7.x) pour continuer a generer la
    // classe BuildConfig utilisee ci-dessus - sans ce flag, buildConfigField serait
    // ignore silencieusement selon la version d'AGP.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation "androidx.fragment:fragment:1.3.0-rc01"
    implementation 'androidx.activity:activity:1.2.0-rc01'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0'
    implementation 'com.google.android.material:material:1.2.0'
    implementation 'androidx.preference:preference:1.1.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    // com.applandeo:material-calendar-view:1.7.0 and com.android.volley:volley:1.0.0
    // removed: neither is imported anywhere in src/ (grep found zero usages), and
    // both fail to resolve today because 1.7.0 of material-calendar-view was only
    // ever published to JCenter (shut down in 2022) and never migrated to Maven
    // Central - only 1.9.0-rc03+ is there. If either turns out to be needed later,
    // re-add material-calendar-view at 1.9.2 (current Maven Central release) and
    // volley at 1.1.1+ instead of these exact versions.
}

// Contournement (07/09/2026, commentaire corrige le 29/09/2026) : Android Studio
// demande la tache "prepareKotlinBuildScriptModel" pendant la synchronisation Gradle,
// meme sur ce module 100% Java. Le retrait des dependances -ktx (lot B) n'a rien
// change : c'est l'IDE qui la reclame, pas une dependance du projet. Comme le plugin
// Kotlin n'est pas applique ici, la tache n'existe pas et la synchro echoue avec
// "Task not found". On la declare en no-op pour que la recherche aboutisse sans rien
// faire.
task prepareKotlinBuildScriptModel {}