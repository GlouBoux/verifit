apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.whatever.verifit"
        minSdkVersion 16
        targetSdkVersion 31
        versionCode 14
        versionName "1.0.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation "androidx.fragment:fragment-ktx:1.3.0-rc01"
    implementation "androidx.fragment:fragment:1.3.0-rc01"
    implementation 'androidx.activity:activity:1.2.0-rc01'
    implementation 'androidx.activity:activity-ktx:1.2.0-rc01'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0'
    implementation 'com.google.android.material:material:1.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.3.0'
    implementation 'androidx.navigation:navigation-ui:2.3.0'
    implementation 'androidx.preference:preference:1.1.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.thegrizzlylabs:sardine-android:0.8'
    implementation 'com.google.code.gson:gson:2.8.9'
    // com.applandeo:material-calendar-view:1.7.0 and com.android.volley:volley:1.0.0
    // removed: neither is imported anywhere in src/ (grep found zero usages), and
    // both fail to resolve today because 1.7.0 of material-calendar-view was only
    // ever published to JCenter (shut down in 2022) and never migrated to Maven
    // Central - only 1.9.0-rc03+ is there. If either turns out to be needed later,
    // re-add material-calendar-view at 1.9.2 (current Maven Central release) and
    // volley at 1.1.1+ instead of these exact versions.
}

// Contournement (07/09/2026) : Android Studio essaie parfois d'executer une tache
// Kotlin ("prepareKotlinBuildScriptModel") meme sur ce module 100% Java, probablement
// a cause des dependances -ktx (fragment-ktx, activity-ktx) ci-dessus qui font croire
// a l'IDE qu'il y a du Kotlin. Comme le plugin Kotlin n'est pas applique ici, cette
// tache n'existe pas et l'IDE plante avec "Task not found". On la declare en no-op
// pour que la recherche de tache aboutisse sans rien faire. Solution standard/connue
// pour ce message d'erreur precis sur des projets Java purs.
task prepareKotlinBuildScriptModel {}