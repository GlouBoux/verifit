apply plugin: 'com.android.application'
// Lot M2 (16/11/2026) : Python embarque (Chaquopy), toujours APRES le plugin Android. Reglages dans
// le bloc chaquopy en fin de fichier.
apply plugin: 'com.chaquo.python'

android {
    compileSdkVersion 31
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.whatever.verifit"
        minSdkVersion 24
        targetSdkVersion 31
        versionCode 14
        versionName "1.0.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Variante de test "dev" (lot M0.2, 14/11/2026) : suffixe du dossier Documents. Vide pour
        // debug et release (l'app de tous les jours), "_dev" pour le type de build dev (voir plus bas).
        buildConfigField "String", "DATA_FOLDER_SUFFIX", '""'

        // Retour Romain 28/09/2026 : "un numero de build [...] pour verifier qu'on
        // parle bien de la meme version" (voir SettingsActivity, preference "version").
        // Horodatage genere automatiquement a CHAQUE build (aucun geste manuel, donc
        // aucun risque d'oubli de mise a jour comme avec versionName ci-dessus) :
        // System.currentTimeMillis() est evalue quand Gradle configure ce module, ce
        // qui arrive a chaque build/rebuild (le script n'est pas mis en cache par
        // defaut dans ce projet). BuildConfig.BUILD_TIMESTAMP est donc l'heure a
        // laquelle CE build a ete produit, pas l'heure d'installation ni l'heure
        // actuelle du telephone.
        buildConfigField "long", "BUILD_TIMESTAMP", "${System.currentTimeMillis()}L"

        // Lot M2 (16/11/2026) : Chaquopy n'embarque Python que pour les ABI listees ici. Python 3.12 et
        // plus n'existe qu'en 64 bits ; arm64-v8a couvre les telephones (pas d'emulateur dans ce projet).
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Requis depuis AGP 8.0 (deja recommande en 7.x) pour continuer a generer la
    // classe BuildConfig utilisee ci-dessus - sans ce flag, buildConfigField serait
    // ignore silencieusement selon la version d'AGP.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        // Lot M0.2 (14/11/2026) : "FitEngine Dev", installable A COTE de l'app de tous les jours
        // (qui est le build debug, signe avec la cle debug : on n'y touche pas). Meme code, meme
        // cle, mais une autre identite : applicationId com.whatever.verifit.dev, autre nom affiche
        // (src/dev/res/values/strings.xml), autres donnees internes, et dossier Documents/FitEngine_dev
        // (AppNames, via BuildConfig.DATA_FOLDER_SUFFIX) pour ne jamais ecrire dans le dossier
        // synchronise par Syncthing. Se choisit dans Build Variants (dev) ou : gradlew :verifit:assembleDev
        dev {
            initWith debug
            signingConfig signingConfigs.debug
            applicationIdSuffix ".dev"
            buildConfigField "String", "DATA_FOLDER_SUFFIX", '"_dev"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation "androidx.fragment:fragment:1.3.0-rc01"
    implementation 'androidx.activity:activity:1.2.0-rc01'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0'
    implementation 'com.google.android.material:material:1.2.0'
    implementation 'androidx.preference:preference:1.1.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    // com.applandeo:material-calendar-view:1.7.0 and com.android.volley:volley:1.0.0
    // removed: neither is imported anywhere in src/ (grep found zero usages), and
    // both fail to resolve today because 1.7.0 of material-calendar-view was only
    // ever published to JCenter (shut down in 2022) and never migrated to Maven
    // Central - only 1.9.0-rc03+ is there. If either turns out to be needed later,
    // re-add material-calendar-view at 1.9.2 (current Maven Central release) and
    // volley at 1.1.1+ instead of these exact versions.
}

// Lot M2 (16/11/2026) : Python embarque par Chaquopy pour le moteur Coaching.
// Le code Python n'est PAS copie dans ce depot : pendant la transition il vit dans le dossier
// moteur/ du depot Coaching (decision de Romain du 13/11/2026), sur lequel le build pointe
// directement. Il sera deplace ici a la bascule (lot M6c). Chemin relatif a ce module :
// 01_Projects/FitNotes_Fork/FitNotes_Fork_Migration/verifit -> 01_Projects/Coaching/moteur.
def moteurPythonDir = file("../../../Coaching/moteur")
if (!moteurPythonDir.isDirectory()) {
    throw new GradleException("Moteur Python introuvable : " + moteurPythonDir
            + " (dossier moteur/ du depot Coaching, lot M2).")
}
// Un __pycache__ ou des .pyc dans moteur/ partiraient dans l'APK comme fichiers de donnees (et un
// .pyc perime pourrait etre execute a la place du code a jour) : on refuse de builder. Les scripts
// PC ne les ecrivent jamais la (scripts/chemin_moteur.py du depot Coaching).
def moteurCompiledFiles = fileTree(moteurPythonDir) {
    include "**/__pycache__/**"
    include "**/*.pyc"
}
if (!moteurCompiledFiles.isEmpty()) {
    throw new GradleException("Fichiers compiles dans " + moteurPythonDir
            + " : supprimer le dossier __pycache__ qui s'y trouve, puis relancer le build.")
}

chaquopy {
    defaultConfig {
        // Doit correspondre au Python du PC (3.13), utilise pendant le build pour compiler le code
        // en .pyc. Trouve tout seul par le lanceur "py -3.13" de Windows.
        version = "3.13"
    }
    sourceSets {
        getByName("main") {
            srcDir(moteurPythonDir)
        }
    }
}

// Contournement (07/09/2026, commentaire corrige le 29/09/2026) : Android Studio
// demande la tache "prepareKotlinBuildScriptModel" pendant la synchronisation Gradle,
// meme sur ce module 100% Java. Le retrait des dependances -ktx (lot B) n'a rien
// change : c'est l'IDE qui la reclame, pas une dependance du projet. Comme le plugin
// Kotlin n'est pas applique ici, la tache n'existe pas et la synchro echoue avec
// "Task not found". On la declare en no-op pour que la recherche aboutisse sans rien
// faire.
task prepareKotlinBuildScriptModel {}