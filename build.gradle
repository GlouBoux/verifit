// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // jcenter() intentionally removed: it shut down in 2022 and only
        // returns empty results now, which was masking the real problem.
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        // Lot M2 (16/11/2026) : Chaquopy, Python embarque pour le moteur Coaching. 17.2 : AGP 7.3 a 9.5,
        // Python 3.10 a 3.15, minSdk 24 (doc chaquo.com/chaquopy/doc/current/versions.html).
        // Publie sur Maven Central (deja dans les depots ci-dessus).
        classpath 'com.chaquo.python:gradle:17.2.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // jcenter() intentionally removed: it shut down in 2022 and only
        // returns empty results now, which was masking the real problem.
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}